# ============================================================
# AgentOffer - Agent 开发岗上岸指南
# agent.meetoffer.cn  (静态站点，零后端)
# 资源目录: /opt/agent-offer/site
# 证书: 复用 *.meetoffer.cn 通配证书
# ============================================================

server {
    listen 80;
    server_name agent.meetoffer.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agent.meetoffer.cn;

    ssl_certificate     /opt/buddy-gateway/ssl/fullchain.pem;
    ssl_certificate_key /opt/buddy-gateway/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options    "nosniff"                    always;
    add_header X-Frame-Options           "SAMEORIGIN"                 always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;

    root  /opt/agent-offer/site;
    index index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;

    # 入口不缓存，保证内容更新立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 静态资源长缓存（文件名不含 hash，设 7 天折中）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
